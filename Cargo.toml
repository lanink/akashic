[package]
name = "akashic"
version = "0.1.0"
edition = "2024"

[lib]
name = "akashic"
path = "src/lib.rs"

[[bin]]
name = "akashic"
path = "src/main.rs"

[dependencies]
dssim = "3.4.0"
gpui = "0.2.2"
gpui-component = "0.5.1"
image = "0.25.10"
# imageflow 以固定 commit 7cbe26be 的 git submodule 引入（见 .gitmodules）。
# feature 说明：zen-codecs（纯 Rust，无 C 工具链）依赖 zenjpeg/zenwebp 的 git main 分支，
# 这两个 API 尚未发布到 crates.io；当网络可访问 GitHub 时，改为下面这行并加对应 patch：
#   imageflow_core = { path = "vendor/imageflow/imageflow_core", default-features = false, features = ["zen-codecs"] }
# 当前基线沿用 c-codecs（本机有 NASM），保证可编译；见 .docs/DEV_PLAN.md 风险表。
imageflow_core = { path = "vendor/imageflow/imageflow_core" }
imageflow_types = { path = "vendor/imageflow/imageflow_types" }
anyhow = "1.0.104"
dirs = "4.0.0"

# ---- M1 真实索引 ----
rusqlite = { version = "0.35.0", features = ["bundled"] }  # 本地索引库，bundled 内嵌 SQLite
kamadak-exif = "0.6.2"   # EXIF 元数据：拍摄时间/设备/GPS/Orientation
walkdir = "2.5.0"        # 递归扫描目录
chrono = "0.4.45"        # 时间解析与格式化
rfd = "0.15.4"           # 原生目录选择对话框
twox-hash = "2.1.3"      # 快速内容哈希（缓存 key / 去重辅助）

# ---- M6 发布构建 ----
# 便携版/安装包使用 `cargo build --release`；thin LTO + 单 codegen unit 换取更小的二进制，
# 代价是首次 release 编译较慢。strip 去掉调试符号；不设 panic=abort，保证 `cargo test --release` 可用。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# 开发模式也把 imageflow 及其 C 编解码器按优化级别编译：
# `cargo run` 默认走 dev，若 imageflow 保持 opt-level=0，4000x3000 预览要 3 秒以上，
# 优化后与 release 接近，避免“功能可用但交互卡住”的体验。
[profile.dev.package.imageflow_c_components]
opt-level = 3

[profile.dev.package.imageflow_core]
opt-level = 3

[profile.dev.package.imageflow_helpers]
opt-level = 3

[profile.dev.package.imageflow_riapi]
opt-level = 3

[profile.dev.package.imageflow_types]
opt-level = 3

# JPEG 解码/编码由 mozjpeg 完成，同样不能在 dev 下跑未优化版本。
[profile.dev.package.mozjpeg]
opt-level = 3

[profile.dev.package.mozjpeg-sys]
opt-level = 3
